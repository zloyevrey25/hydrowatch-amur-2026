[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrowatch-amur"
version = "0.1.0"
description = "STURM-Flood baseline for the CosmoHackathon 2026 hydrological monitoring case"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "rasterio>=1.4,<2",
  "scipy>=1.13,<2",
  "tensorflow>=2.16,<2.19",
  "tensorflow-io>=0.37,<0.38",
]

[project.scripts]
hydrowatch-baseline = "hydrowatch_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

