[sturm]
repository = "external/STURM-Flood"
weights = "models/sturm_s1/unet/1/model_weights.hdf5"
patch_size = 128
stride = 96
batch_size = 4

[normalization]
# STURM S1 tiles are normalized. These clipping limits reproduce the published
# compatibility preprocessing used for raw VV/VH sigma0 values in dB. They must
# be validated by ablation on held-out events.
vv_min_db = -30.0
vv_max_db = 10.0
vh_min_db = -30.0
vh_max_db = 10.0

[model]
# Output channels: water_pre, water_peak, flood.
water_threshold = 0.50
flood_threshold = 0.50
missing_optical_value = -1.0

[optical]
# Band order in the case reference export. The multimodal baseline consumes
# NDWI and MNDWI from each date; the other bands remain available for ablations.
# B3, B4, B8, B11, NDWI, MNDWI, NDVI, AWEIsh
ndwi_band = 5
mndwi_band = 6
ndvi_band = 7
awei_band = 8

[training]
optical_dropout = 0.35
negatives_per_positive = 2.0
warmup_learning_rate = 0.001
finetune_learning_rate = 0.00001
water_pre_loss_weight = 1.0
water_peak_loss_weight = 1.0
flood_loss_weight = 2.0

[hydrology]
slope_max_deg = 5.0
hand_max_m = 25.0
permanent_occurrence_min = 80.0
exclude_builtup = true
minimum_component_pixels = 25
